<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎣 Рыбалка на карте</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- MapLibre GL JS для OpenFreeMap -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --surface-light: #243447;
            --primary: #00d4aa;
            --primary-dark: #00b894;
            --text: #e8ecf1;
            --text-secondary: #8899a6;
            --accent: #ff6b35;
            --danger: #e74c3c;
            --success: #2ecc71;
            --warning: #f39c12;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--surface-light);
            z-index: 1000;
        }
        .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .search-box {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--surface-light);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        .search-box button {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            color: #000;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .filters {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: var(--surface);
            overflow-x: auto;
            border-bottom: 1px solid var(--surface-light);
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: var(--surface-light);
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #000;
        }
        .filter-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #map {
            flex: 1;
            min-height: 0;
            background: var(--bg);
        }
        /* Стилизуем атрибуцию MapLibre */
        .maplibregl-ctrl-attrib {
            background: rgba(15, 20, 25, 0.85) !important;
            color: var(--text-secondary) !important;
            font-size: 9px !important;
        }
        .maplibregl-ctrl-attrib a {
            color: var(--text-secondary) !important;
        }
        .bottom-panel {
            background: var(--surface);
            border-top: 1px solid var(--surface-light);
            padding: 12px 16px;
            max-height: 45vh;
            overflow-y: auto;
        }
        .result-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
        }
        .result-card h3 { font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .warning-box {
            background: rgba(243, 156, 18, 0.1);
            border-left: 3px solid var(--warning);
            padding: 12px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--warning);
        }
        .weather-row {
            display: flex;
            gap: 12px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .weather-item {
            background: var(--surface-light);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
        }
        .bite-score {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-light);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
        }
        .bite-score.high { color: var(--success); }
        .bite-score.medium { color: var(--warning); }
        .bite-score.low { color: var(--danger); }
        .bite-score.zero { color: var(--danger); opacity: 0.7; }
        .advice-box {
            background: var(--surface-light);
            border-left: 3px solid var(--primary);
            padding: 12px;
            border-radius: 0 10px 10px 0;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.5;
        }
        .loading { text-align: center; padding: 20px; color: var(--text-secondary); }
        .error { text-align: center; padding: 20px; color: var(--danger); }
        .loc-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 500;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,212,170,0.3);
        }
        .fish-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        .fish-tag {
            background: var(--surface-light);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .fish-tag.missing {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
        }
    </style>
<base target="_blank">
<base target="_blank">
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🎣 Рыбалка на карте</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Введите водоём: озеро Байкал, река Дон...">
                <button onclick="searchSpot()">🔍</button>
            </div>
        </div>

        <div class="filters" id="filters">
            <button class="filter-btn active" onclick="setFish('all')">🐟 Все</button>
        </div>

        <div id="map"></div>
        <button class="loc-btn" onclick="getLocation()" title="Рядом со мной">📍</button>

        <div class="bottom-panel" id="bottomPanel">
            <div class="loading">Введите водоём в поиске или нажмите 📍 для поиска рядом</div>
        </div>
    </div>

    <script>
        const N8N_WEBHOOK_URL = 'https://vadim.n8nmanage.com/webhook/fish-advice';

        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.MainButton.setText('🔄 Обновить данные');
        tg.MainButton.onClick(() => { if(lastQuery) searchSpot(lastQuery); });

        // ✅ OpenFreeMap — бесплатно, без ключа, без регистрации
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty/style.json',
            center: [37.6173, 55.7558], // [lon, lat]
            zoom: 5,
            attributionControl: true
        });

        // Кастомная кнопка геолокации
        map.addControl(new maplibregl.NavigationControl(), 'top-left');

        let currentFish = 'all';
        let lastQuery = '';
        let markers = [];
        let popups = [];
        let currentFishTypes = ['щука','судак','окунь','лещ','карась'];

        function setFish(fish) {
            currentFish = fish;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const btn = event && event.target ? event.target : document.querySelector(`button[onclick*="setFish('${fish}')"]`);
            if(btn) btn.classList.add('active');
            if(lastQuery) searchSpot(lastQuery);
        }

        function renderFilters(fishTypes) {
            const container = document.getElementById('filters');
            let html = `<button class="filter-btn ${currentFish === 'all' ? 'active' : ''}" onclick="setFish('all')">🐟 Все</button>`;

            const fishEmojis = {
                'щука': '🐊', 'судак': '🦈', 'окунь': '🐠', 'лещ': '🐡', 'карась': '🐢',
                'треска': '🐟', 'палтус': '🐋', 'сёмга': '🐟', 'морской окунь': '🐠', 'камбала': '🐡',
                'голавль': '🐟', 'язь': '🐟', 'линь': '🐢'
            };

            fishTypes.forEach(fish => {
                const emoji = fishEmojis[fish] || '🐟';
                const isActive = currentFish === fish ? 'active' : '';
                html += `<button class="filter-btn ${isActive}" onclick="setFish('${fish}')">${emoji} ${fish}</button>`;
            });

            container.innerHTML = html;
        }

        function clearMarkers() {
            markers.forEach(m => m.remove());
            popups.forEach(p => p.remove());
            markers = [];
            popups = [];
        }

        async function searchSpot(query) {
            if(!query) query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            lastQuery = query;

            const panel = document.getElementById('bottomPanel');
            panel.innerHTML = '<div class="loading">🔍 Ищем информацию о водоёме...</div>';
            tg.MainButton.show();

            try {
                const res = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, fish: currentFish })
                });
                const data = await res.json();

                if(data.spots && data.spots[0] && data.spots[0].fish_types) {
                    currentFishTypes = data.spots[0].fish_types;
                    renderFilters(currentFishTypes);
                }

                renderResults(data);
            } catch(e) {
                console.error(e);
                await fallbackSearch(query);
            }
        }

        async function fallbackSearch(query) {
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&accept-language=ru`);
                const geoData = await geoRes.json();

                if(!geoData || geoData.length === 0) {
                    document.getElementById('bottomPanel').innerHTML = '<div class="error">❌ Водоём не найден. Попробуйте другой запрос.</div>';
                    return;
                }

                const place = geoData[0];
                const lat = parseFloat(place.lat);
                const lon = parseFloat(place.lon);
                const name = place.display_name.toLowerCase();

                let fishTypes = ['щука','судак','окунь','лещ','карась'];
                let warning = '';
                let waterType = 'fresh';

                if(name.includes('море') || name.includes('sea') || name.includes('ocean') || name.includes('океан')) {
                    fishTypes = ['треска','палтус','сёмга','морской окунь','камбала'];
                    warning = '⚠️ Морская рыбалка. Пресноводная рыба (щука, лещ, карась) здесь не водится.';
                    waterType = 'salt';
                } else if(name.includes('река') || name.includes('river')) {
                    fishTypes = ['щука','судак','окунь','лещ','голавль','язь'];
                    waterType = 'river';
                }

                currentFishTypes = fishTypes;
                renderFilters(fishTypes);

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,pressure_msl&timezone=auto`);
                const weather = await weatherRes.json();
                const w = weather.current;

                const biteScore = calculateBiteScore(w.temperature_2m, w.pressure_msl, w.wind_speed_10m, w.weather_code, currentFish, fishTypes);
                const advice = generateAdvice(currentFish, w.temperature_2m, w.weather_code, biteScore, fishTypes, warning);

                const result = {
                    spots: [{
                        name: place.display_name.split(',')[0],
                        description: place.display_name,
                        lat, lon,
                        fish_types: fishTypes,
                        water_type: waterType
                    }],
                    weather: {
                        temp: w.temperature_2m,
                        pressure: Math.round(w.pressure_msl * 0.750062),
                        wind: w.wind_speed_10m,
                        humidity: w.relative_humidity_2m
                    },
                    biteScore,
                    advice,
                    warning
                };

                renderResults(result);

            } catch(e) {
                console.error(e);
                document.getElementById('bottomPanel').innerHTML = '<div class="error">❌ Ошибка загрузки. Проверьте интернет.</div>';
            }
        }

        function calculateBiteScore(temp, pressureHpa, wind, code, targetFish, fishTypes) {
            if(targetFish && targetFish !== 'all' && !fishTypes.includes(targetFish)) {
                return 0;
            }

            let score = 5;
            if(temp >= 15 && temp <= 22) score += 2;
            else if(temp >= 10 && temp <= 25) score += 1;

            const pressure = pressureHpa * 0.750062;
            if(pressure >= 745 && pressure <= 755) score += 1;
            else if(pressure < 740 || pressure > 760) score -= 1;

            if(wind < 3) score += 1;
            else if(wind > 10) score -= 1;

            if(code >= 51 && code <= 67) score += 2;
            if(code >= 80 && code <= 82) score += 2;

            const hour = new Date().getHours();
            if((hour >= 5 && hour <= 9) || (hour >= 18 && hour <= 21)) score += 1;

            return Math.max(1, Math.min(10, Math.round(score)));
        }

        function generateAdvice(fish, temp, code, score, fishTypes, warning) {
            const tips = {
                'треска': 'Треска на донку с креветкой. Глубина 50-150м.',
                'палтус': 'Палтус — джиг с крупными силиконовыми приманками.',
                'сёмга': 'Сёмга на спиннинг с блёснами. Рассвет и закат.',
                'морской окунь': 'Морской окунь на мормышку и маленькие воблеры.',
                'камбала': 'Камбала — донка с червём или креветкой.',
                'щука': 'Щука на границе травы. Воблеры и живец.',
                'судак': 'Судак на ямах. Джиг с твистером.',
                'окунь': 'Окунь на микроджиг у коряг.',
                'лещ': 'Лещ на донку с макухой.',
                'карась': 'Карась на червя и кукурузу.',
                'голавль': 'Голавль — спиннинг с маленькими воблерами у перекатов.',
                'язь': 'Язь на маховую удочку с мотылём.',
                'линь': 'Линь — донка с червём в тихих заливах.'
            };

            if(fish && fish !== 'all' && !fishTypes.includes(fish)) {
                return `⚠️ <b>${fish}</b> в этом водоёме не водится.<br><br>Здесь можно поймать: <b>${fishTypes.join(', ')}</b>.`;
            }

            let weatherText = '';
            if(temp < 5) weatherText = 'Холодно — одевайтесь теплее.';
            else if(temp > 25) weatherText = 'Жара — рыба на глубине, ловите утром/вечером.';
            else weatherText = 'Температура комфортная для рыбалки.';

            const target = fish !== 'all' ? fish : fishTypes[0];
            const tip = tips[target] || tips[fishTypes[0]] || 'Пробуйте разные снасти.';

            let result = `${weatherText} ${tip}`;
            if(warning) result = `${warning}<br><br>${result}`;
            return result;
        }

        function renderResults(data) {
            clearMarkers();
            const panel = document.getElementById('bottomPanel');

            if(!data.spots || data.spots.length === 0) {
                panel.innerHTML = '<div class="error">❌ Ничего не найдено</div>';
                return;
            }

            let html = '';
            if(data.warning) {
                html += `<div class="warning-box">${data.warning}</div>`;
            }

            data.spots.forEach(spot => {
                let scoreClass, scoreEmoji;
                if(data.biteScore === 0) {
                    scoreClass = 'zero';
                    scoreEmoji = '🚫';
                } else if(data.biteScore >= 7) {
                    scoreClass = 'high';
                    scoreEmoji = '🔥';
                } else if(data.biteScore >= 4) {
                    scoreClass = 'medium';
                    scoreEmoji = '👍';
                } else {
                    scoreClass = 'low';
                    scoreEmoji = '❄️';
                }

                const fishTagsHtml = spot.fish_types.map(f => {
                    const missing = currentFish !== 'all' && currentFish === f && !spot.fish_types.includes(f);
                    return `<span class="fish-tag ${missing ? 'missing' : ''}">${f}</span>`;
                }).join('');

                html += `
                <div class="result-card">
                    <h3>📍 ${spot.name}</h3>
                    <p style="color:var(--text-secondary);font-size:13px;margin-bottom:10px;">${spot.description || ''}</p>

                    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">
                        🐟 Рыба в этом водоёме:
                    </div>
                    <div class="fish-list">
                        ${fishTagsHtml}
                    </div>

                    <div class="weather-row">
                        <div class="weather-item">🌡️ ${data.weather.temp}°C</div>
                        <div class="weather-item">💨 ${data.weather.wind} м/с</div>
                        <div class="weather-item">🌡️ ${data.weather.pressure} мм</div>
                        <div class="weather-item">💧 ${data.weather.humidity}%</div>
                    </div>

                    <div class="bite-score ${scoreClass}">
                        ${scoreEmoji} Клёв: ${data.biteScore}/10
                    </div>

                    <div class="advice-box">
                        <strong>💡 Совет:</strong><br>${data.advice}
                    </div>
                </div>
                `;

                // ✅ MapLibre Marker
                const el = document.createElement('div');
                el.style.width = '24px';
                el.style.height = '24px';
                el.style.background = 'var(--primary)';
                el.style.borderRadius = '50%';
                el.style.border = '3px solid #fff';
                el.style.boxShadow = '0 2px 8px rgba(0,0,0,0.4)';
                el.style.cursor = 'pointer';

                const marker = new maplibregl.Marker(el)
                    .setLngLat([spot.lon, spot.lat])
                    .setPopup(new maplibregl.Popup({ offset: 15 }).setHTML(`<div style="font-family:Inter,sans-serif;padding:4px;"><b>${spot.name}</b><br>Клёв: ${data.biteScore}/10</div>`))
                    .addTo(map);
                markers.push(marker);
            });

            panel.innerHTML = html;

            // Центрируем карту
            if(data.spots.length > 0) {
                map.flyTo({
                    center: [data.spots[0].lon, data.spots[0].lat],
                    zoom: 12,
                    essential: true
                });
            }
        }

        function getLocation() {
            if(!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                return;
            }
            document.getElementById('bottomPanel').innerHTML = '<div class="loading">📍 Определяем ваше местоположение...</div>';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    map.flyTo({
                        center: [lon, lat],
                        zoom: 14,
                        essential: true
                    });

                    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ru`)
                        .then(r => r.json())
                        .then(data => {
                            const name = data.address.city || data.address.town || data.address.village || 'Рядом со мной';
                            searchSpot(name);
                        })
                        .catch(() => searchSpot(`${lat},${lon}`));
                },
                err => {
                    document.getElementById('bottomPanel').innerHTML = '<div class="error">❌ Не удалось получить геолокацию</div>';
                }
            );
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if(e.key === 'Enter') searchSpot();
        });

        renderFilters(currentFishTypes);
    </script>
</body>
</html>

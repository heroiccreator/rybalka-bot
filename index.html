<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎣 Рыбалка на карте</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --surface-light: #243447;
            --primary: #00d4aa;
            --primary-dark: #00b894;
            --text: #e8ecf1;
            --text-secondary: #8899a6;
            --accent: #ff6b35;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .header {
            background: var(--surface);
            padding: 12px 16px;
            border-bottom: 1px solid var(--surface-light);
            z-index: 1000;
        }
        .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .search-box {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .search-box input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--surface-light);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-secondary); }
        .search-box button {
            background: var(--primary);
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            color: #000;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .filters {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: var(--surface);
            overflow-x: auto;
            border-bottom: 1px solid var(--surface-light);
        }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn {
            background: var(--surface-light);
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--primary);
            color: #000;
        }
        #map {
            flex: 1;
            min-height: 0;
        }
        .leaflet-popup-content-wrapper {
            background: var(--surface);
            color: var(--text);
            border-radius: 12px;
        }
        .leaflet-popup-tip { background: var(--surface); }
        .bottom-panel {
            background: var(--surface);
            border-top: 1px solid var(--surface-light);
            padding: 12px 16px;
            max-height: 45vh;
            overflow-y: auto;
            transition: transform 0.3s;
        }
        .bottom-panel.hidden { transform: translateY(100%); }
        .result-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 10px;
        }
        .result-card h3 { font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .weather-row {
            display: flex;
            gap: 12px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .weather-item {
            background: var(--surface-light);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
        }
        .bite-score {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-light);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
        }
        .bite-score.high { color: var(--success); }
        .bite-score.medium { color: #f1c40f; }
        .bite-score.low { color: var(--danger); }
        .advice-box {
            background: var(--surface-light);
            border-left: 3px solid var(--primary);
            padding: 12px;
            border-radius: 0 10px 10px 0;
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
        .error {
            text-align: center;
            padding: 20px;
            color: var(--danger);
        }
        .loc-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 500;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,212,170,0.3);
        }
    </style>
<base target="_blank">
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🎣 Рыбалка на карте</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Введите водоём: озеро Байкал, река Дон...">
                <button onclick="searchSpot()">🔍</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="setFish('all')">🐟 Все</button>
            <button class="filter-btn" onclick="setFish('щука')">🐊 Щука</button>
            <button class="filter-btn" onclick="setFish('судак')">🦈 Судак</button>
            <button class="filter-btn" onclick="setFish('окунь')">🐠 Окунь</button>
            <button class="filter-btn" onclick="setFish('лещ')">🐡 Лещ</button>
            <button class="filter-btn" onclick="setFish('карась')">🐢 Карась</button>
        </div>

        <div id="map"></div>
        <button class="loc-btn" onclick="getLocation()" title="Рядом со мной">📍</button>

        <div class="bottom-panel" id="bottomPanel">
            <div class="loading">Введите водоём в поиске или нажмите 📍 для поиска рядом</div>
        </div>
    </div>

    <script>
        // ===== КОНФИГУРАЦИЯ (уже заполнена) =====
        const N8N_WEBHOOK_URL = 'https://vadim.n8nmanage.com/webhook/fish-advice';
        const SUPABASE_URL = 'https://utgobcpthqhedqibkupc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0Z29iY3B0aHFoZWRxaWJrdXBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNDM5MzMsImV4cCI6MjEwMjkxOTkzM30.BhbqZKdonfNjjItjWaMUPuHirS4ZIi_8h5yqX0iDaGw';

        // Telegram WebApp init
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.MainButton.setText('🔄 Обновить данные');
        tg.MainButton.onClick(() => { if(lastQuery) searchSpot(lastQuery); });

        // Map init
        const map = L.map('map').setView([55.7558, 37.6173], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let currentFish = 'all';
        let lastQuery = '';
        let markers = [];

        function setFish(fish) {
            currentFish = fish;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(lastQuery) searchSpot(lastQuery);
        }

        function clearMarkers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
        }

        async function searchSpot(query) {
            if(!query) query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            lastQuery = query;

            const panel = document.getElementById('bottomPanel');
            panel.innerHTML = '<div class="loading">🔍 Ищем информацию о водоёме...</div>';
            tg.MainButton.show();

            try {
                const res = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, fish: currentFish })
                });
                const data = await res.json();
                renderResults(data);
            } catch(e) {
                console.error(e);
                await fallbackSearch(query);
            }
        }

        async function fallbackSearch(query) {
            try {
                const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&accept-language=ru`);
                const geoData = await geoRes.json();

                if(!geoData || geoData.length === 0) {
                    document.getElementById('bottomPanel').innerHTML = '<div class="error">❌ Водоём не найден. Попробуйте другой запрос.</div>';
                    return;
                }

                const place = geoData[0];
                const lat = parseFloat(place.lat);
                const lon = parseFloat(place.lon);

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,pressure_msl&timezone=auto`);
                const weather = await weatherRes.json();
                const w = weather.current;

                const biteScore = calculateBiteScore(w.temperature_2m, w.pressure_msl, w.wind_speed_10m, w.weather_code);
                const advice = generateAdvice(currentFish, w.temperature_2m, w.weather_code, biteScore);

                const result = {
                    spots: [{
                        name: place.display_name.split(',')[0],
                        description: place.display_name,
                        lat, lon,
                        fish_types: ['щука','судак','окунь','лещ','карась']
                    }],
                    weather: {
                        temp: w.temperature_2m,
                        pressure: Math.round(w.pressure_msl * 0.750062),
                        wind: w.wind_speed_10m,
                        humidity: w.relative_humidity_2m
                    },
                    biteScore,
                    advice
                };

                renderResults(result);

            } catch(e) {
                document.getElementById('bottomPanel').innerHTML = '<div class="error">❌ Ошибка загрузки. Проверьте интернет.</div>';
            }
        }

        function calculateBiteScore(temp, pressureHpa, wind, code) {
            let score = 5;
            if(temp >= 15 && temp <= 22) score += 2;
            else if(temp >= 10 && temp <= 25) score += 1;

            const pressure = pressureHpa * 0.750062;
            if(pressure >= 745 && pressure <= 755) score += 1;
            else if(pressure < 740 || pressure > 760) score -= 1;

            if(wind < 3) score += 1;
            else if(wind > 10) score -= 1;

            if(code >= 51 && code <= 67) score += 2;
            if(code >= 80 && code <= 82) score += 2;

            const hour = new Date().getHours();
            if((hour >= 5 && hour <= 9) || (hour >= 18 && hour <= 21)) score += 1;

            return Math.max(1, Math.min(10, Math.round(score)));
        }

        function generateAdvice(fish, temp, code, score) {
            const fishTips = {
                'щука': 'Щука активна на границе травы. Используйте воблеры или живца.',
                'судак': 'Судак стоит на ямах и бровках. Джиг — лучший выбор.',
                'окунь': 'Окунь клюёт на микроджиг и мормышку. Ищите коряги.',
                'лещ': 'Леща ловите на донку с макухой или опарышем.',
                'карась': 'Карась берёт на червя и кукурузу в тёплой залишне.',
                'all': 'Пробуйте разные снасти в зависимости от целевой рыбы.'
            };

            let weatherText = '';
            if(temp < 5) weatherText = 'Холодно — одевайтесь теплее, рыба вялая.';
            else if(temp > 25) weatherText = 'Жара — рыба уходит на глубину, ловите рано утром.';
            else weatherText = 'Температура комфортная для рыбалки.';

            const tip = fishTips[fish] || fishTips['all'];
            return `${weatherText} ${tip} Прогноз клёва: ${score}/10.`;
        }

        function renderResults(data) {
            clearMarkers();
            const panel = document.getElementById('bottomPanel');

            if(!data.spots || data.spots.length === 0) {
                panel.innerHTML = '<div class="error">❌ Ничего не найдено</div>';
                return;
            }

            let html = '';
            data.spots.forEach(spot => {
                const scoreClass = data.biteScore >= 7 ? 'high' : data.biteScore >= 4 ? 'medium' : 'low';
                const scoreEmoji = data.biteScore >= 7 ? '🔥' : data.biteScore >= 4 ? '👍' : '❄️';

                html += `
                <div class="result-card">
                    <h3>📍 ${spot.name}</h3>
                    <p style="color:var(--text-secondary);font-size:13px;margin-bottom:10px;">${spot.description || ''}</p>

                    <div class="weather-row">
                        <div class="weather-item">🌡️ ${data.weather.temp}°C</div>
                        <div class="weather-item">💨 ${data.weather.wind} м/с</div>
                        <div class="weather-item">🌡️ ${data.weather.pressure} мм</div>
                        <div class="weather-item">💧 ${data.weather.humidity}%</div>
                    </div>

                    <div class="bite-score ${scoreClass}">
                        ${scoreEmoji} Клёв: ${data.biteScore}/10
                    </div>

                    <div class="advice-box">
                        <strong>💡 Совет:</strong><br>${data.advice}
                    </div>
                </div>
                `;

                const marker = L.marker([spot.lat, spot.lon]).addTo(map);
                marker.bindPopup(`<b>${spot.name}</b><br>Клёв: ${data.biteScore}/10`);
                markers.push(marker);
            });

            panel.innerHTML = html;

            if(markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
            }
        }

        function getLocation() {
            if(!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                return;
            }
            document.getElementById('bottomPanel').innerHTML = '<div class="loading">📍 Определяем ваше местоположение...</div>';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    map.setView([lat, lon], 12);

                    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ru`)
                        .then(r => r.json())
                        .then(data => {
                            const name = data.address.city || data.address.town || data.address.village || 'Рядом со мной';
                            searchSpot(name);
                        })
                        .catch(() => searchSpot(`${lat},${lon}`));
                },
                err => {
                    document.getElementById('bottomPanel').innerHTML = '<div class="error">❌ Не удалось получить геолокацию</div>';
                }
            );
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if(e.key === 'Enter') searchSpot();
        });
    </script>
</body>
</html>
